<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, brother!</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#3a3b3f;--fg:#fff;--btn1:#1b2a6b;--btn2:#0d1647}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden;position:relative}
.line{position:fixed;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px #fff,0 0 14px #fff,0 0 30px rgba(255,255,255,.7);z-index:3;animation:pulse 3s ease-in-out infinite}
.line.l{left:14px}.line.r{right:14px}
@keyframes pulse{50%{opacity:.6}}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 38px;text-align:center;gap:48px}
#text{font-size:clamp(22px,5.5vw,40px);line-height:1.4;max-width:720px;text-shadow:0 0 12px rgba(255,255,255,.35)}
#text .w{display:inline-block;opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.2);animation:fly .9s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--d);margin:0 .13em}
@keyframes fly{to{opacity:1;transform:none}}
.orbit{position:relative;width:230px;height:150px;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
.orbit.hide{opacity:0;pointer-events:none}
.ring{position:absolute;inset:0;animation:spin 9s linear infinite}
.ring span{position:absolute;left:50%;top:50%;font-size:24px;margin:-14px;transform:rotate(var(--a)) translate(105px,0) rotate(calc(-1*var(--a)))}
@keyframes spin{to{transform:rotate(360deg)}}
.ring span{animation:counter 9s linear infinite}
@keyframes counter{to{rotate:-360deg}}
button{position:relative;z-index:2;font:inherit;font-size:22px;color:#fff;padding:14px 38px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:linear-gradient(145deg,var(--btn1),var(--btn2));box-shadow:0 0 18px rgba(60,90,255,.6);cursor:pointer;transition:transform .2s}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="line l"></div><div class="line r"></div>
<canvas id="c"></canvas>
<main>
  <div id="text"></div>
  <div class="orbit" id="orbit">
    <div class="ring" id="ring"></div>
    <button id="btn">Further</button>
  </div>
</main>
<script>
var texts=[
 "Hi brother) I congratulate you on your birthday and on this day I want to tell you…",
 "You’re an incredible person. I wish you to always stay the same kind) I also wish you more crypts haha) and don’t forget ... you need to train a lot)",
 "Happy birthday again, brother. Mark your day and let it be remembered) Good luck!"
];
var step=0,tEl=document.getElementById('text'),btn=document.getElementById('btn'),orbit=document.getElementById('orbit');
var em=['🎉','🎈','🎂','🎁','🥳','✨','🎊','🎆'],ring=document.getElementById('ring');
em.forEach(function(e,i){var s=document.createElement('span');s.textContent=e;s.style.setProperty('--a',(i*45)+'deg');ring.appendChild(s)});
function show(t){
  tEl.innerHTML='';
  t.split(' ').forEach(function(w,i){
    var s=document.createElement('span');s.className='w';s.textContent=w;
    s.style.setProperty('--x',(Math.random()*500-250)+'px');
    s.style.setProperty('--y',(Math.random()*500-250)+'px');
    s.style.setProperty('--r',(Math.random()*120-60)+'deg');
    s.style.setProperty('--d',(i*0.07)+'s');
    tEl.appendChild(s);
  });
}
show(texts[0]);
btn.onclick=function(){
  step++;
  show(texts[step]);
  if(step===1)party();
  if(step===2){btn.textContent='🎉';orbit.classList.add('hide');burst()}
};
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W,H,items=[],on=false;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);
var cols=['#ffd166','#ef476f','#06d6a0','#4cc9f0','#ffffff','#b388ff'];
function mk(){return {x:Math.random()*W,y:-20,s:5+Math.random()*7,v:1.5+Math.random()*3,a:Math.random()*6,va:(Math.random()-.5)*.2,c:cols[Math.random()*cols.length|0],b:Math.random()<.12,e:['🎈','🎉','🎊'][Math.random()*3|0]}}
function party(){if(on)return;on=true;loop()}
function burst(){for(var i=0;i<120;i++){var p=mk();p.y=Math.random()*H*.5;items.push(p)}}
function loop(){
  cx.clearRect(0,0,W,H);
  if(items.length<110)items.push(mk());
  items.forEach(function(p,i){
    p.y+=p.v;p.a+=p.va;p.x+=Math.sin(p.a)*1.2;
    if(p.b){cx.font='26px serif';cx.fillText(p.e,p.x,p.y)}
    else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
    if(p.y>H+30)items[i]=mk();
  });
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
